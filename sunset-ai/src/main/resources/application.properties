# Can be overridden using APP_STORAGE_DIRECTORY and APP_CHAT_INITIALIZE_SCHEMA.
app.storage.directory=${APP_STORAGE_DIRECTORY:./data}
app.storage.max-pdf-bytes=20971520
app.chat.initialize-schema=${APP_CHAT_INITIALIZE_SCHEMA:true}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Short selected PDFs use full text; long documents use scoped retrieval.
app.pdf.max-context-chars=16000
app.pdf.similarity-threshold=0.3
app.pdf.top-k=6

# Browser login uses a server-side session; passwords/tokens are not stored in localStorage.
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
app.web.allowed-origins=${APP_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
app.pdf.tasks.workers=2
app.pdf.tasks.queue-capacity=8
app.pdf.tasks.max-pending=20
